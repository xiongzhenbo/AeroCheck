name: Build Standalone Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android launcher icons & splash screen
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi

          RES_DIR="android/app/src/main/res"
          cat << 'EOF' > "${RES_DIR}/values/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0D1117</color>
          </resources>
          EOF

          declare -A LAUNCHER_SIZES=(
            ["mdpi"]=48
            ["hdpi"]=72
            ["xhdpi"]=96
            ["xxhdpi"]=144
            ["xxxhdpi"]=192
          )
          declare -A FOREGROUND_SIZES=(
            ["mdpi"]=108
            ["hdpi"]=162
            ["xhdpi"]=216
            ["xxhdpi"]=324
            ["xxxhdpi"]=432
          )

          for density in "${!LAUNCHER_SIZES[@]}"; do
            l_size="${LAUNCHER_SIZES[$density]}"
            f_size="${FOREGROUND_SIZES[$density]}"
            mkdir -p "${RES_DIR}/mipmap-${density}"
            convert public/pwa-512x512.png -resize "${l_size}x${l_size}" "${RES_DIR}/mipmap-${density}/ic_launcher.png"
            convert public/pwa-512x512.png -resize "${l_size}x${l_size}" "${RES_DIR}/mipmap-${density}/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize "${f_size}x${f_size}" "${RES_DIR}/mipmap-${density}/ic_launcher_foreground.png"
          done

          # Replace Capacitor default splash screens with AeroCheck dark splash
          mkdir -p "${RES_DIR}/drawable"
          convert -size 1080x1920 xc:"#0D1117" \
            \( public/pwa-512x512.png -resize 288x288 \) -gravity center -composite \
            "${RES_DIR}/drawable/splash.png"
          for splash_file in "${RES_DIR}"/drawable-*/splash.png; do
            if [ -f "$splash_file" ]; then
              cp "${RES_DIR}/drawable/splash.png" "$splash_file"
            fi
          done

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Zipalign and sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-aligned.apk"
          SIGNED_APK="AeroCheck-Android.apk"
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            STORE_PASS="aerocheck-ci-keystore"
            KEY_ALIAS="aerocheck"
            KEY_PASS="aerocheck-ci-keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=AeroCheck, OU=Maintenance, O=AeroCheck, L=Ramp, S=Ops, C=CN"
          fi

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroCheck-Android-APK
          path: AeroCheck-Android.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (latest)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AeroCheck-Android.apk --clobber
          else
            gh release create latest AeroCheck-Android.apk \
              --title "AeroCheck Android APK (Latest)" \
              --notes "纯独立离线版安卓安装包（不依赖任何浏览器）。请直接下载安装 AeroCheck-Android.apk。"
          fi
