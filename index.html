<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>机务电子检查单 · AeroCheck</title>
    <meta name="description" content="专为航空机务人员打造的离线电子检查单应用，支持航前、航后、过站等自定义检查单管理、点击变绿确认与一键重置重复使用。" />
    <meta property="og:title" content="机务电子检查单 · AeroCheck" />
    <meta property="og:description" content="专为航空机务人员打造的离线电子检查单应用，支持航前、航后、过站等自定义检查单管理、点击变绿确认与一键重置重复使用。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0D1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="机务检查单" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0D1117] dark:text-slate-100 antialiased selection:bg-emerald-500/30">
    <div id="root">
      <div
        id="boot-fallback"
        class="min-h-screen flex flex-col items-center justify-center gap-2 px-6 text-center text-slate-500 dark:text-slate-400"
      >
        <div class="text-sm font-semibold tracking-tight text-slate-700 dark:text-slate-200">
          AeroCheck · 机务电子检查单
        </div>
        <div class="text-xs opacity-75">Loading...</div>
      </div>
    </div>
    <script>
      (function () {
        var retryKey = 'aerocheck_boot_retry_ts';
        function recoverIfStuck() {
          if (!document.getElementById('boot-fallback')) return;
          try {
            var last = Number(sessionStorage.getItem(retryKey) || '0');
            var now = Date.now();
            if (now - last > 10000) {
              sessionStorage.setItem(retryKey, String(now));
              window.location.reload();
            }
          } catch (e) {
            // Ignore storage errors
          }
        }
        window.addEventListener('pageshow', function (e) {
          if (e.persisted && document.getElementById('boot-fallback')) {
            recoverIfStuck();
          }
        });
        window.setTimeout(recoverIfStuck, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
